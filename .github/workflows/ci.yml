name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: Unit and offline pipeline tests
        run: cd backend && python -m pytest -q
      - name: Offline experiment smoke test (mock model)
        env: { SCHOLARFIT_MOCK: "1" }
        run: |
          python eval/run_experiment.py --name ci_smoke --systems B0 B1 S2 --runs 1 \
            --pairs backend/tests/fixtures/pairs.csv --programmes backend/tests/fixtures/programmes.jsonl
          python eval/report.py --name ci_smoke
