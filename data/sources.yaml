# Programme sources for the dated snapshot (53 pages across 12 families, collected 2026-11-21).
#
# BEFORE CRAWLING (supervisor point 8): open each family's site, read its terms of use and
# robots.txt, then fill `terms_checked`, e.g. "2026-11-21, Fatima S: no crawling ban, robots allows".
# crawl.py skips a family until this is filled, and it also refuses any URL robots.txt disallows.
#
# Some sites need JavaScript (HEC SharePoint pages, studyinkorea.go.kr) and may come back almost
# empty; parse.py lists those in needs_ocr.txt. For those, open the page in a browser, copy the
# eligibility text, and save it as data/programmes/manual/<id>.md (header format in README).
#
# A few pages are official documents hosted on another institution's site (CSC requirements, GKS
# guidelines, MEXT guidelines); they are the provider's own text, kept because the provider's
# site is JavaScript-only or the PDF is not linked directly.

